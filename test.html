<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    
    // --- ICONS ---
    const createIcon = (svgContent) => ({ size = 24, className = "", ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props} dangerouslySetInnerHTML={{ __html: svgContent }} />
    );
    const ShieldAlert = createIcon('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/>');
    const CheckCircle2 = createIcon('<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>');
    const Users = createIcon('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>');
    const Trophy = createIcon('<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7c0 6 6 10 6 10s6-4 6-10V2z"/>');
    const Settings = createIcon('<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>');
    const LogOut = createIcon('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>');
    const Activity = createIcon('<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>');
    const BarChart3 = createIcon('<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>');
    const AlertCircle = createIcon('<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>');
    const MapPin = createIcon('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>');
    const PlayCircle = createIcon('<circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/>');
    const Edit3 = createIcon('<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>');

    // --- MOCK DATABASE ---
    const MOCK_USERS = [
      { id: 'u1', username: 'admin', password: 'pass', role: 'admin', name: 'System Admin' },
      { id: 'u1b', username: 'reg_west', password: 'pass', role: 'region_admin', name: 'Region Admin (Western)', region: 'Western' },
      { id: 'u1c', username: 'reg_cent', password: 'pass', role: 'region_admin', name: 'Region Admin (Central)', region: 'Central' },
      { id: 'u1d', username: 'reg_east', password: 'pass', role: 'region_admin', name: 'Region Admin (Eastern)', region: 'Eastern' },
      { id: 'u2', username: 'headref_w', password: 'pass', role: 'head_ref', name: 'Head Referee (Western)', region: 'Western' },
      { id: 'u3', username: 'ref_fastbot', password: 'pass', role: 'ref', name: 'Ref (FastBot)', category: 'c1_fastbot', region: 'Western' },
      { id: 'u3b', username: 'ref_amaze', password: 'pass', role: 'ref', name: 'Ref (a-Maze-ing)', category: 'c1_amazeing', region: 'Central' },
      { id: 'u3c', username: 'ref_sumo', password: 'pass', role: 'ref', name: 'Ref (Sumo Bot)', category: 'c2_sumo', region: 'Eastern' },
      { id: 'u4', username: 'vol_west', password: 'pass', role: 'volunteer', name: 'Door Staff (Western)', region: 'Western' },
      { id: 'u4b', username: 'vol_cent', password: 'pass', role: 'volunteer', name: 'Door Staff (Central)', region: 'Central' },
    ];

    const MOCK_CATEGORIES = [
      { id: 'c1_fastbot', name: 'FastBot', group: 1, levels: ['ES', 'MS', 'HS', 'US'] },
      { id: 'c1_linefollow', name: 'LineFollowing', group: 1, levels: ['ES', 'MS', 'HS', 'US'] },
      { id: 'c1_amazeing', name: 'a-Maze-ing', group: 1, levels: ['ES', 'MS', 'HS', 'US'] },
      { id: 'c2_sumo', name: 'Sumo Bot (Head-to-Head)', group: 2, levels: ['MS', 'HS'] },
      { id: 'c2_soccer', name: 'SoccerBot (Head-to-Head)', group: 2, levels: ['MS', 'HS'] },
      { id: 'c3_ai', name: 'AI Innovation (Presentation)', group: 3, levels: ['HS', 'US'] },
    ];

    const INITIAL_TEAMS = [
      { id: 't1', name: 'Cyber Falcons', division: 'HS', region: 'Western', members: [{id:'m1', name:'Omar', present:false}, {id:'m2', name:'Ali', present:false}], coach: {name:'Dr. Ahmed', present:false}, categories: ['c2_sumo', 'c3_ai'] },
      { id: 't2', name: 'Desert Rovers', division: 'MS', region: 'Central', members: [{id:'m3', name:'Sara', present:false}, {id:'m4', name:'Nour', present:false}], coach: {name:'Eng. Fatima', present:false}, categories: ['c1_fastbot', 'c2_sumo'] },
      { id: 't3', name: 'Tech Titans', division: 'ES', region: 'Eastern', members: [{id:'m5', name:'Ziad', present:false}], coach: {name:'Mr. Khaled', present:false}, categories: ['c1_linefollow', 'c2_soccer'] },
      { id: 't4', name: 'Neural Nets', division: 'US', region: 'Western', members: [{id:'m6', name:'Tariq', present:false}, {id:'m7', name:'Youssef', present:false}], coach: {name:'Dr. Salem', present:false}, categories: ['c3_ai'] },
      { id: 't5', name: 'Maze Runners', division: 'MS', region: 'Western', members: [{id:'m8', name:'Fahad', present:false}], coach: {name:'Mr. Sami', present:false}, categories: ['c1_amazeing', 'c2_soccer'] },
      { id: 't6', name: 'Line Masters', division: 'ES', region: 'Central', members: [{id:'m9', name:'Layan', present:false}, {id:'m10', name:'Joud', present:false}], coach: {name:'Ms. Reem', present:false}, categories: ['c1_linefollow', 'c1_fastbot'] },
      { id: 't7', name: 'Robo Knights', division: 'ES', region: 'Eastern', members: [{id:'m11', name:'Saud', present:false}, {id:'m12', name:'Bader', present:false}], coach: {name:'Dr. Tariq', present:false}, categories: ['c1_amazeing', 'c2_sumo'] },
      { id: 't8', name: 'AI Pioneers', division: 'US', region: 'Central', members: [{id:'m13', name:'Nasser', present:false}], coach: {name:'Prof. Hind', present:false}, categories: ['c3_ai', 'c1_fastbot'] }
    ];

    // --- SHARED COMPONENTS ---
    const PrecisionTimer = ({ initialSeconds, onStop, isSoccerBot, disabled }) => {
      const [timeLeft, setTimeLeft] = useState(initialSeconds);
      const [isRunning, setIsRunning] = useState(false);
      const [switchTimer, setSwitchTimer] = useState(null);
      const [hasSwitched, setHasSwitched] = useState(false);

      useEffect(() => {
        let interval;
        if (isRunning && switchTimer === null && timeLeft > 0) {
          interval = setInterval(() => {
            setTimeLeft(prev => {
              const next = prev - 0.01;
              if (isSoccerBot && !hasSwitched && Math.abs(next - 90.00) < 0.015) {
                setSwitchTimer(30.00);
                setHasSwitched(true);
              }
              if (next <= 0) {
                setIsRunning(false);
                return 0;
              }
              return next;
            });
          }, 10);
        } else if (switchTimer !== null) {
          interval = setInterval(() => {
            setSwitchTimer(prev => {
              const next = prev - 0.01;
              if (next <= 0) return null;
              return next;
            });
          }, 10);
        }
        return () => clearInterval(interval);
      }, [isRunning, switchTimer, isSoccerBot, hasSwitched, timeLeft]);

      const handleStop = () => {
        setIsRunning(false);
        onStop((initialSeconds - timeLeft).toFixed(2), timeLeft.toFixed(2));
      };

      return (
        <div className="bg-slate-900 p-4 rounded-xl flex items-center justify-between mb-4 text-white">
          <div>
            <div className="text-sm font-bold text-slate-400 uppercase tracking-wider">Active Timer</div>
            <div className="text-3xl font-mono font-black text-teal-400">
              {switchTimer !== null ? `SWITCH: ${switchTimer.toFixed(2)}s` : `${timeLeft.toFixed(2)}s`}
            </div>
          </div>
          <div className="space-x-2">
            <button onClick={() => setIsRunning(true)} disabled={disabled || isRunning || timeLeft <= 0 || switchTimer !== null} className="px-4 py-2 bg-teal-600 hover:bg-teal-500 disabled:bg-slate-700 disabled:opacity-50 rounded font-bold transition-colors">Start</button>
            <button onClick={handleStop} disabled={disabled || (!isRunning && timeLeft === initialSeconds)} className="px-4 py-2 bg-rose-600 hover:bg-rose-500 disabled:bg-slate-700 disabled:opacity-50 rounded font-bold transition-colors">Stop Timer</button>
          </div>
        </div>
      );
    };

    const getInspectionStatus = (categoryId, isInitial, insp) => {
      let passed = true;
      const check = (keys) => keys.every(k => insp[k] === true);
      const isNum = (v) => v !== undefined && v !== '' && !isNaN(parseFloat(v));

      if (categoryId === 'c1_fastbot') {
        if (isInitial && !check(['autonomy', 'irSensor', 'lineFollow', 'startPos'])) passed = false;
        if (!check(['safety', 'operator'])) passed = false;
        if (isNum(insp.width) && isNum(insp.height) && isNum(insp.depth)) {
          const v = parseFloat(insp.width) * parseFloat(insp.height) * parseFloat(insp.depth);
          if (v > 65030) passed = false;
        } else { passed = false; }
      } else if (categoryId === 'c1_linefollow') {
        if (isInitial && !check(['autonomy', 'irSensor', 'lineFollow', 'startPos', 'stopTower', 'deliveryMech'])) passed = false;
        if (!check(['safety', 'operator', 'payloadBalls'])) passed = false;
        if (isNum(insp.width) && isNum(insp.height) && isNum(insp.depth)) {
          const v = parseFloat(insp.width) * parseFloat(insp.height) * parseFloat(insp.depth);
          if (v > 65030) passed = false;
        } else { passed = false; }
      } else if (categoryId === 'c1_amazeing') {
        if (isInitial && !check(['autonomy', 'autoForward', 'minTurn', 'forwardPost'])) passed = false;
        if (!check(['safety', 'operator', 'sensorRestr'])) passed = false;
        if (isNum(insp.width) && isNum(insp.height) && isNum(insp.depth)) {
          const w = parseFloat(insp.width);
          const v = w * parseFloat(insp.height) * parseFloat(insp.depth);
          if (v > 65030 || w > 24) passed = false;
        } else { passed = false; }
      } else if (categoryId === 'c2_sumo') {
        if (isInitial && !check(['autonomy', 'edgeDetect', 'oppSearch', 'startPos'])) passed = false;
        if (!check(['safety', 'operator'])) passed = false;
        if (isNum(insp.width) && isNum(insp.length) && isNum(insp.weight) && isNum(insp.maxWeight)) {
          if (parseFloat(insp.width) > 18 || parseFloat(insp.length) > 25 || parseFloat(insp.weight) > parseFloat(insp.maxWeight)) passed = false;
        } else { passed = false; }
      } else if (categoryId === 'c2_soccer') {
        if (isInitial && !check(['twoRobots', 'r1_autonomy', 'r1_hardware', 'r2_autonomy', 'r2_hardware'])) passed = false;
        if (!check(['r1_safety', 'r2_safety', 'operator'])) passed = false;
        if (isNum(insp.r1_w) && isNum(insp.r1_l) && isNum(insp.r1_h) && isNum(insp.r2_w) && isNum(insp.r2_l) && isNum(insp.r2_h)) {
          if (parseFloat(insp.r1_w) > 15 || parseFloat(insp.r1_l) > 15 || parseFloat(insp.r1_h) > 15) passed = false;
          if (parseFloat(insp.r2_w) > 15 || parseFloat(insp.r2_l) > 15 || parseFloat(insp.r2_h) > 15) passed = false;
        } else { passed = false; }
      }
      return passed;
    };

    const CategoryInspectionUI = ({ categoryId, isInitial, insp, updateInsp, disabled }) => {
      const CheckItem = ({ id, label }) => (
         <label className={`flex items-center space-x-3 bg-slate-50 p-2 rounded border cursor-pointer hover:bg-slate-100 transition-colors ${insp[id] ? 'border-green-400 bg-green-50/50' : 'border-slate-200'} ${disabled ? 'opacity-70 cursor-not-allowed' : ''}`}>
            <input type="checkbox" checked={insp[id] || false} onChange={e => updateInsp(id, e.target.checked)} disabled={disabled} className="w-5 h-5 text-teal-600 rounded focus:ring-teal-500 disabled:opacity-50" />
            <span className="text-sm font-semibold text-slate-700 leading-tight">{label}</span>
         </label>
      );

      const isNum = (v) => v !== undefined && v !== '' && !isNaN(parseFloat(v));

      if (categoryId === 'c2_soccer') {
        const r1Pass = isNum(insp.r1_w) && isNum(insp.r1_l) && isNum(insp.r1_h) && parseFloat(insp.r1_w)<=15 && parseFloat(insp.r1_l)<=15 && parseFloat(insp.r1_h)<=15;
        const r2Pass = isNum(insp.r2_w) && isNum(insp.r2_l) && isNum(insp.r2_h) && parseFloat(insp.r2_w)<=15 && parseFloat(insp.r2_l)<=15 && parseFloat(insp.r2_h)<=15;
        return (
          <div className="space-y-4 mb-6">
            <h5 className="text-sm font-bold text-slate-600 uppercase tracking-wider border-b pb-1">SoccerBot Inspection</h5>
            {isInitial && <CheckItem id="twoRobots" label="Team presents exactly two robots" />}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="border border-slate-200 p-3 rounded bg-white shadow-sm">
                <h6 className="font-bold text-xs text-slate-500 mb-3 border-b pb-1">ROBOT 1</h6>
                <div className="space-y-2 mb-3">
                  {isInitial && <CheckItem id="r1_autonomy" label="Autonomy" />}
                  {isInitial && <CheckItem id="r1_hardware" label="Hardware Compliance" />}
                  <CheckItem id="r1_safety" label="Safety Checks" />
                </div>
                <div className="bg-slate-50 p-2 rounded border border-slate-200">
                   <h6 className="text-xs font-bold text-slate-500 mb-2">Dimensions (W≤15, L≤15, H≤15)</h6>
                   <div className="flex space-x-2 mb-2">
                     <input type="number" placeholder="W" value={insp.r1_w || ''} onChange={e=>updateInsp('r1_w', e.target.value)} disabled={disabled} className="w-full p-1.5 border rounded text-xs outline-none focus:ring-1 focus:ring-teal-500 disabled:bg-slate-100"/>
                     <input type="number" placeholder="L" value={insp.r1_l || ''} onChange={e=>updateInsp('r1_l', e.target.value)} disabled={disabled} className="w-full p-1.5 border rounded text-xs outline-none focus:ring-1 focus:ring-teal-500 disabled:bg-slate-100"/>
                     <input type="number" placeholder="H" value={insp.r1_h || ''} onChange={e=>updateInsp('r1_h', e.target.value)} disabled={disabled} className="w-full p-1.5 border rounded text-xs outline-none focus:ring-1 focus:ring-teal-500 disabled:bg-slate-100"/>
                   </div>
                   <div className={`px-2 py-1 text-xs text-center font-bold rounded ${r1Pass ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>{r1Pass ? 'R1 DIMS PASS' : 'FAIL'}</div>
                </div>
              </div>
              <div className="border border-slate-200 p-3 rounded bg-white shadow-sm">
                <h6 className="font-bold text-xs text-slate-500 mb-3 border-b pb-1">ROBOT 2</h6>
                <div className="space-y-2 mb-3">
                  {isInitial && <CheckItem id="r2_autonomy" label="Autonomy" />}
                  {isInitial && <CheckItem id="r2_hardware" label="Hardware Compliance" />}
                  <CheckItem id="r2_safety" label="Safety Checks" />
                </div>
                <div className="bg-slate-50 p-2 rounded border border-slate-200">
                   <h6 className="text-xs font-bold text-slate-500 mb-2">Dimensions (W≤15, L≤15, H≤15)</h6>
                   <div className="flex space-x-2 mb-2">
                     <input type="number" placeholder="W" value={insp.r2_w || ''} onChange={e=>updateInsp('r2_w', e.target.value)} disabled={disabled} className="w-full p-1.5 border rounded text-xs outline-none focus:ring-1 focus:ring-teal-500 disabled:bg-slate-100"/>
                     <input type="number" placeholder="L" value={insp.r2_l || ''} onChange={e=>updateInsp('r2_l', e.target.value)} disabled={disabled} className="w-full p-1.5 border rounded text-xs outline-none focus:ring-1 focus:ring-teal-500 disabled:bg-slate-100"/>
                     <input type="number" placeholder="H" value={insp.r2_h || ''} onChange={e=>updateInsp('r2_h', e.target.value)} disabled={disabled} className="w-full p-1.5 border rounded text-xs outline-none focus:ring-1 focus:ring-teal-500 disabled:bg-slate-100"/>
                   </div>
                   <div className={`px-2 py-1 text-xs text-center font-bold rounded ${r2Pass ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>{r2Pass ? 'R2 DIMS PASS' : 'FAIL'}</div>
                </div>
              </div>
            </div>
            <CheckItem id="operator" label="Operator Restrictions" />
            <div className="mt-2">
              <label className="block text-xs font-bold text-slate-500 mb-1">Referee Notes (Optional)</label>
              <textarea value={insp.notes || ''} onChange={e=>updateInsp('notes', e.target.value)} disabled={disabled} className="w-full p-2 border border-slate-200 rounded text-sm h-16 focus:ring-1 focus:ring-teal-500 outline-none disabled:bg-slate-100"></textarea>
            </div>
          </div>
        );
      }

      let reqItems = [];
      if (isInitial) reqItems.push({ id: 'autonomy', label: 'Autonomy' });
      
      if (categoryId === 'c1_fastbot' || categoryId === 'c1_linefollow') {
         if (isInitial) {
            reqItems.push({ id: 'irSensor', label: 'IR Sensor Usage & Status' });
            reqItems.push({ id: 'lineFollow', label: 'Line-following Demonstration' });
            reqItems.push({ id: 'startPos', label: 'Start Position Compliance' });
         }
      }
      
      if (categoryId === 'c1_linefollow') {
         if (isInitial) reqItems.push({ id: 'stopTower', label: 'Stopping at Tower Demonstration' });
         reqItems.push({ id: 'payloadBalls', label: 'Validation of Payload Balls (Ping-pong)' });
         if (isInitial) reqItems.push({ id: 'deliveryMech', label: 'Delivery Mech Independence' });
      }

      if (categoryId === 'c1_amazeing') {
         reqItems.push({ id: 'sensorRestr', label: 'Sensor Restrictions (Wheel Encoders Only)' });
         if (isInitial) {
            reqItems.push({ id: 'autoForward', label: 'Autonomous Forward Movement' });
            reqItems.push({ id: 'minTurn', label: 'Minimum 45-degree Turning' });
            reqItems.push({ id: 'forwardPost', label: 'Forward Movement Post-turn' });
         }
      }

      if (categoryId === 'c2_sumo') {
         if (isInitial) {
            reqItems.push({ id: 'edgeDetect', label: 'Edge Detection & Avoidance Sensor' });
            reqItems.push({ id: 'oppSearch', label: 'Opponent-Searching Program' });
            reqItems.push({ id: 'startPos', label: 'Start Position Compliance' });
         }
      }

      reqItems.push({ id: 'safety', label: 'Safety Checks' });
      reqItems.push({ id: 'operator', label: 'Operator Restrictions' });

      return (
        <div className="space-y-4 mb-6">
          <h5 className="text-sm font-bold text-slate-600 uppercase tracking-wider border-b pb-1">Inspection Checklist</h5>
          
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
            {reqItems.map(item => <CheckItem key={item.id} id={item.id} label={item.label} />)}
          </div>

          {categoryId === 'c2_sumo' ? (
            <div className="bg-slate-50 p-3 rounded border border-slate-200 mb-4">
               <h6 className="text-xs font-bold text-slate-500 mb-2">Dimensions (W≤18cm, L≤25cm, Wgt≤MaxWgt)</h6>
               <div className="flex space-x-2 mb-2">
                 <input type="number" placeholder="W" value={insp.width || ''} onChange={e=>updateInsp('width', e.target.value)} disabled={disabled} className="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-teal-500 outline-none disabled:bg-slate-100"/>
                 <input type="number" placeholder="L" value={insp.length || ''} onChange={e=>updateInsp('length', e.target.value)} disabled={disabled} className="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-teal-500 outline-none disabled:bg-slate-100"/>
                 <input type="number" placeholder="Wgt (kg)" value={insp.weight || ''} onChange={e=>updateInsp('weight', e.target.value)} disabled={disabled} className="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-teal-500 outline-none disabled:bg-slate-100"/>
                 <input type="number" placeholder="MaxWgt" value={insp.maxWeight || ''} onChange={e=>updateInsp('maxWeight', e.target.value)} disabled={disabled} className="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-teal-500 outline-none disabled:bg-slate-100"/>
               </div>
               <div className="flex justify-between items-center">
                 <span className="text-sm font-medium text-slate-600">Calculated:</span>
                 <span className={`px-2 py-1 text-xs font-bold rounded ${
                   (isNum(insp.width) && isNum(insp.length) && isNum(insp.weight) && isNum(insp.maxWeight) && parseFloat(insp.width)<=18 && parseFloat(insp.length)<=25 && parseFloat(insp.weight)<=parseFloat(insp.maxWeight)) ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                 }`}>
                   {(isNum(insp.width) && isNum(insp.length) && isNum(insp.weight) && isNum(insp.maxWeight) && parseFloat(insp.width)<=18 && parseFloat(insp.length)<=25 && parseFloat(insp.weight)<=parseFloat(insp.maxWeight)) ? 'PASS' : 'FAIL'}
                 </span>
               </div>
            </div>
          ) : (
            <div className="bg-slate-50 p-3 rounded border border-slate-200 mb-4">

    // --- WORKFLOWS ---
    const Group1Workflow = ({ category, participations, teams, scores, setScores, systemConfig }) => {

        const matchLevel = levelFilter ? t.division === levelFilter : true;
        return matchSearch && matchLevel;

      const teamName = selectedP ? teams.find(t => t.id === activeParticipations.find(p=>p.id===selectedP)?.teamId)?.name : '';

                     setScores(prev => prev.map(s => s.id === id ? {...s, proposedScore: newScore, proposedInspection: newInsp, proposedRawInput: newRaw, status: 'PENDING'} : s));

                   setSelectedP('');

                   setScores(prev => [...prev, { id: Date.now(), pId: selectedP, score: s, inspectionData: insp, rawInput: rawData, status: 'VALID' }]);
                   setSelectedP('');

               {category.id === 'c1_amazeing' && <AMazeIngAttemptCard title={`Attempt ${existingScores.length + 1}: ${teamName}`} categoryId={category.id} teamDivision={teams.find(t=>t.id === activeParticipations.find(p=>p.id===selectedP)?.teamId)?.division} attemptNumber={existingScores.length + 1} onSaveScore={(s, insp, rawData) => {

    // --- MAIN UI COMPONENTS ---
    const TeamAttendanceCard = ({ team, getTeamStatus, confirmAttendance, buttonText, participations }) => {
      const [draftCoachPresent, setDraftCoachPresent] = useState(team.coach.present);
      const [draftMembers, setDraftMembers] = useState(team.members.map(m => ({...m})));

      useEffect(() => {
        setDraftCoachPresent(team.coach.present);
        setDraftMembers(team.members.map(m => ({...m})));
      }, [team]);

      const total = draftMembers.length + 1;
      const presentCount = draftMembers.filter(m => m.present).length + (draftCoachPresent ? 1 : 0);
      
      const originalStatus = getTeamStatus(team);
      let draftStatus = 'Partially Arrived';
      if (presentCount === 0) draftStatus = 'No-Show';
      if (presentCount === total) draftStatus = 'Fully Arrived';

        'No-Show': 'bg-slate-100 border-slate-300 text-slate-500',
        'Partially Arrived': 'bg-teal-50 border-teal-400 text-teal-800',
        'Fully Arrived': 'bg-green-50 border-green-500 text-green-800'
      };

      let displayButtonText = buttonText;
      let isButtonDisabled = false;

      if (buttonText === 'Check-In') {
        if (originalStatus === 'No-Show' && draftStatus === 'No-Show') {
          isButtonDisabled = true;

    const CheckInSystem = ({ teams, getTeamStatus, confirmAttendance, participations }) => {

      const [levelFilter, setLevelFilter] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('');
      
      const pendingTeams = teams.filter(t => getTeamStatus(t) !== 'Fully Arrived');
      
      const filteredPending = pendingTeams.filter(t => {

          </div>

          <div className="flex flex-col md:flex-row gap-4 mb-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <input type="text" placeholder="Search Team Name or Number (ID)..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="p-3 border-2 border-slate-200 rounded-xl flex-1 focus:ring-2 focus:ring-teal-500 outline-none font-medium text-slate-700" />
            <select value={levelFilter} onChange={e => setLevelFilter(e.target.value)} className="p-3 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none font-medium text-slate-700">
              <option value="">All Levels</option>
              <option value="ES">ES</option>
              <option value="MS">MS</option>
              <option value="HS">HS</option>
              <option value="US">US</option>
            </select>
            <select value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)} className="p-3 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none font-medium text-slate-700">
              <option value="">All Categories</option>
              {MOCK_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>

          <div className="flex space-x-3 border-b-2 border-slate-200 pb-2">
             <button
                onClick={() => setActiveTab('No-Show')}
                className={`px-5 py-2.5 font-bold rounded-t-lg transition-colors ${activeTab === 'No-Show' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
              >
                No-show ({noShowTeams.length})
             </button>
             <button
                onClick={() => setActiveTab('Partially Arrived')}
                className={`px-5 py-2.5 font-bold rounded-t-lg transition-colors ${activeTab === 'Partially Arrived' ? 'bg-teal-600 text-white' : 'bg-teal-50 text-teal-700 hover:bg-teal-100'}`}
              >
                Partially Checked-in ({partialTeams.length})
             </button>
          </div>

          {visibleTeams.length === 0 ? (
            <div className="p-8 text-center bg-white rounded-xl border border-slate-200">
              <p className="text-slate-500 font-medium">No teams currently match the filters in this category.</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4">
              {visibleTeams.map(team => (
                 <TeamAttendanceCard key={team.id} team={team} getTeamStatus={getTeamStatus} confirmAttendance={confirmAttendance} buttonText="Check-In" participations={participations} />
              ))}
            </div>
          )}
        </div>
      );
    };

    const RosterRow = ({ team, getTeamStatus, confirmAttendance }) => {
      const [isEditing, setIsEditing] = useState(false);
      const [draftCoach, setDraftCoach] = useState(team.coach.present);
      const [draftMembers, setDraftMembers] = useState(team.members.map(m=>({...m})));

      useEffect(() => {
        setDraftCoach(team.coach.present);
        setDraftMembers(team.members.map(m=>({...m})));
      }, [team]);

      const studentsCount = draftMembers.filter(m=>m.present).length;
      const coachCount = draftCoach ? 1 : 0;
      const membersDisplay = `${studentsCount} + ${coachCount}`;

      const total = draftMembers.length + 1;
      const presentCount = studentsCount + coachCount;
      let draftStatus = 'Partially Arrived';
      if (presentCount === 0) draftStatus = 'No-Show';
      if (presentCount === total) draftStatus = 'Fully Arrived';

      const handleSave = () => {
        confirmAttendance(team.id, draftCoach, draftMembers);
        setIsEditing(false);
      };

      return (
        <React.Fragment>
          <tr className={`border-b border-slate-100 hover:bg-slate-50 ${isEditing ? 'bg-slate-50' : ''}`}>
            <td className="p-3 font-semibold text-slate-800">{team.name}</td>
            <td className="p-3 text-slate-600 font-mono text-sm">{team.id}</td>
            <td className="p-3 text-slate-600 text-sm">{team.categories.map(cId => MOCK_CATEGORIES.find(c => c.id === cId)?.name).join(', ')}</td>
            <td className="p-3 text-slate-700 font-bold">{membersDisplay}</td>
            <td className="p-3">
              <span className={`px-2 py-1 rounded text-xs font-bold ${draftStatus === 'Fully Arrived' ? 'bg-green-100 text-green-800' : draftStatus === 'Partially Arrived' ? 'bg-teal-100 text-teal-800' : 'bg-slate-200 text-slate-600'}`}>
                {draftStatus}
              </span>
            </td>
            <td className="p-3">
              <button onClick={() => setIsEditing(!isEditing)} className="text-teal-600 hover:text-teal-800 font-bold text-sm bg-teal-50 hover:bg-teal-100 px-3 py-1 rounded transition-colors">
                {isEditing ? 'Cancel' : 'Edit'}
              </button>
            </td>
          </tr>
          {isEditing && (
            <tr className="bg-slate-50 border-b-2 border-slate-200">
              <td colSpan="6" className="p-4">
                <div className="flex flex-col md:flex-row gap-4 items-start md:items-center justify-between bg-white p-4 rounded border shadow-sm">
                  <div className="flex flex-wrap gap-4">
                    <label className="flex items-center space-x-2 cursor-pointer bg-slate-100 p-2 rounded">
                      <input type="checkbox" checked={draftCoach} onChange={e => setDraftCoach(e.target.checked)} className="w-5 h-5 text-teal-600 rounded focus:ring-teal-500" />
                      <span className="text-sm font-bold text-slate-700">Coach: {team.coach.name}</span>
                    </label>
                    {draftMembers.map(m => (
                      <label key={m.id} className="flex items-center space-x-2 cursor-pointer bg-slate-100 p-2 rounded">
                        <input type="checkbox" checked={m.present} onChange={() => setDraftMembers(prev => prev.map(member => member.id === m.id ? {...member, present: !member.present} : member))} className="w-5 h-5 text-teal-600 rounded focus:ring-teal-500" />
                        <span className="text-sm font-medium text-slate-700">Student: {m.name}</span>
                      </label>
                    ))}
                  </div>
                  <button onClick={handleSave} className="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-6 rounded-lg shadow-sm whitespace-nowrap">
                    Save Attendance
                  </button>
                </div>
              </td>
            </tr>
          )}
        </React.Fragment>
      );
    };

    const OperationsSystem = ({ scores, setScores, teams, getTeamStatus, confirmAttendance, generateMatches, participations, currentUser, systemConfig, setSystemConfig }) => {
      const pendingScores = scores.filter(s => s.status === 'PENDING');
      const [rosterSearch, setRosterSearch] = useState('');
      
      const filteredRoster = teams.filter(t => t.name.toLowerCase().includes(rosterSearch.toLowerCase()) || t.id.toLowerCase().includes(rosterSearch.toLowerCase()));

      return (
        <div className="space-y-8">
          <h2 className="text-2xl font-bold text-slate-800 flex items-center"><Settings className="mr-2 text-slate-600"/> Operations Command Center</h2>
          
          {currentUser?.role === 'admin' && (
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
              <div className="bg-slate-900 p-4 flex justify-between items-center text-white border-b-4 border-teal-500">
                 <h3 className="font-bold flex items-center"><Settings className="mr-2 text-teal-400" size={20}/> Configuration Parameters</h3>
                 <span className="bg-teal-600 text-white px-3 py-1 rounded-full text-xs font-bold shadow-sm uppercase tracking-wider">System Admin Only</span>
              </div>
              <div className="p-6">
                 <p className="text-sm text-slate-500 mb-6">Modify the competition thresholds dynamically across the active competition portal.</p>
                 <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div className="bg-slate-50 p-5 rounded-xl border border-slate-200">
                       <h4 className="font-bold text-slate-800 mb-4 flex items-center border-b pb-2"><Activity size={18} className="mr-2 text-slate-500"/> FastBot - Required Laps</h4>
                       <div className="space-y-3">
                         {['ES', 'MS', 'HS', 'US'].map(div => (
                            <div key={div} className="flex justify-between items-center bg-white p-2 px-3 rounded shadow-sm border border-slate-100">
                              <span className="text-sm font-semibold text-slate-700">{div} Division</span>
                              <input type="number" min="0" value={systemConfig.fastbotLaps[div]} onChange={e => setSystemConfig({...systemConfig, fastbotLaps: {...systemConfig.fastbotLaps, [div]: parseInt(e.target.value)||0}})} className="border-2 border-slate-200 rounded p-1 w-20 text-center font-mono font-bold focus:ring-2 focus:ring-teal-500 outline-none" />
                            </div>
                         ))}
                       </div>
                    </div>
                    <div className="bg-slate-50 p-5 rounded-xl border border-slate-200">
                       <h4 className="font-bold text-slate-800 mb-4 flex items-center border-b pb-2"><MapPin size={18} className="mr-2 text-slate-500"/> Line Following - Required Balls</h4>
                       <div className="space-y-3">
                         {['ES', 'MS', 'HS', 'US'].map(div => (
                            <div key={div} className="flex justify-between items-center bg-white p-2 px-3 rounded shadow-sm border border-slate-100">
                              <span className="text-sm font-semibold text-slate-700">{div} Division</span>
                              <input type="number" min="0" value={systemConfig.linefollowBalls[div]} onChange={e => setSystemConfig({...systemConfig, linefollowBalls: {...systemConfig.linefollowBalls, [div]: parseInt(e.target.value)||0}})} className="border-2 border-slate-200 rounded p-1 w-20 text-center font-mono font-bold focus:ring-2 focus:ring-teal-500 outline-none" />
                            </div>
                         ))}
                       </div>
                    </div>
                 </div>
              </div>
            </div>
          )}

          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div className="bg-green-600 p-4 flex justify-between items-center text-white">
              <h3 className="font-bold flex items-center"><CheckCircle2 className="mr-2"/> Competition Roster (All Teams)</h3>
              <span className="bg-white text-green-700 px-3 py-1 rounded-full text-xs font-bold shadow-sm">{teams.length} Teams Registered</span>
            </div>
            <div className="p-6 bg-slate-50">
              <p className="text-sm text-slate-500 mb-6">You can search and edit live attendance status here. Unchecking a member will immediately downgrade the team's status and move them back to the Check-In system.</p>
              
              <div className="mb-4">
                <input type="text" placeholder="Search Team Name or Number..." value={rosterSearch} onChange={e=>setRosterSearch(e.target.value)} className="w-full md:w-1/2 p-3 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none font-medium text-slate-700" />
              </div>

              {filteredRoster.length === 0 ? (
                 <div className="text-center py-6 text-slate-400 font-medium bg-white rounded-xl border border-slate-200">No active teams found.</div>
              ) : (
                <div className="overflow-x-auto bg-white rounded-xl border border-slate-200 shadow-sm">
                  <table className="w-full text-left border-collapse min-w-[800px]">
                    <thead>
                      <tr className="bg-slate-100 text-slate-600 text-sm uppercase tracking-wider">
                        <th className="p-4 border-b-2 font-bold">Team Name</th>
                        <th className="p-4 border-b-2 font-bold">Team Number</th>
                        <th className="p-4 border-b-2 font-bold">Category</th>
                        <th className="p-4 border-b-2 font-bold">Members (St + Co)</th>
                        <th className="p-4 border-b-2 font-bold">Check-In Status</th>
                        <th className="p-4 border-b-2 font-bold w-24">Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                       {filteredRoster.map(team => <RosterRow key={team.id} team={team} getTeamStatus={getTeamStatus} confirmAttendance={confirmAttendance} />)}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>

          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div className="bg-slate-900 p-4 flex justify-between items-center text-white">
              <h3 className="font-bold flex items-center"><Activity className="mr-2 text-orange-400"/> Action Center: Score Edit Approvals</h3>
              <span className="bg-orange-500 text-white px-2 py-1 rounded-full text-xs font-bold">{pendingScores.length} Pending</span>
            </div>
            <div className="p-6">
              {pendingScores.length === 0 ? (
                <p className="text-slate-500 text-center py-8">No pending approvals.</p>
              ) : (
                <div className="space-y-4">
                  {pendingScores.map(score => (
                    <div key={score.id} className="flex justify-between items-center p-4 border border-slate-200 rounded-xl bg-slate-50 shadow-sm">
                      <div className="flex-1 pr-4">
                        <p className="font-bold text-slate-800">Participation ID / Match: {score.pId}</p>
                        <div className="mt-2 text-sm">
                          <div className="flex items-center space-x-2">
                            <span className="text-slate-500 w-24">Original Score:</span>
                            <span className="font-mono text-slate-700 font-bold bg-slate-200 px-2 py-1 rounded">{score.score}</span>
                          </div>
                          <div className="flex items-center space-x-2 mt-1">
                            <span className="text-slate-500 w-24">Requested Edit:</span>
                            <span className="font-mono text-orange-600 font-bold bg-orange-100 px-2 py-1 rounded">{score.proposedScore}</span>
                          </div>
                        </div>
                      </div>
                      <div className="flex flex-col space-y-2">
                        <button onClick={() => setScores(scores.map(s => s.id === score.id ? {...s, score: s.proposedScore, inspectionData: s.proposedInspection || s.inspectionData, inspectionA: s.proposedInspectionA || s.inspectionA, inspectionB: s.proposedInspectionB || s.inspectionB, rawInput: s.proposedRawInput || s.rawInput, proposedScore: undefined, proposedInspection: undefined, proposedInspectionA: undefined, proposedInspectionB: undefined, proposedRawInput: undefined, status: 'VALID'} : s))} className="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm">Approve</button>
                        <button onClick={() => setScores(scores.map(s => s.id === score.id ? {...s, proposedScore: undefined, proposedInspection: undefined, proposedInspectionA: undefined, proposedInspectionB: undefined, proposedRawInput: undefined, status: 'VALID'} : s))} className="bg-slate-300 hover:bg-slate-400 text-slate-800 px-4 py-2 rounded-lg font-bold text-sm">Reject</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
          
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
               <h3 className="font-bold text-lg mb-4 text-slate-800 flex items-center"><Users className="mr-2 text-teal-600"/> User Management (Mock)</h3>
               <p className="text-sm text-slate-500 mb-4">Add, remove, or modify roles. Data persists to backend schema.</p>
               <button className="w-full border-2 border-dashed border-slate-300 text-slate-600 font-bold py-3 rounded-xl hover:bg-slate-50">
                 + Add New Staff Member
               </button>
            </div>
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
               <h3 className="font-bold text-lg mb-4 text-slate-800 flex items-center"><PlayCircle className="mr-2 text-teal-600"/> Matchmaking Engine</h3>
               <p className="text-sm text-slate-500 mb-4">Generate bracket schedules for Group 2 challenges to push to the Competing System.</p>
               <button onClick={generateMatches} className="w-full bg-slate-800 text-white font-bold py-3 rounded-xl hover:bg-slate-700">
                 Populate Group 2 Matches
               </button>
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [currentView, setCurrentView] = useState('dashboard');
      
      const [teams, setTeams] = useState(INITIAL_TEAMS);
      const [participations, setParticipations] = useState([]);
      const [scores, setScores] = useState([]);
      const [group2Matches, setGroup2Matches] = useState([]);
      
      const [adminRegion, setAdminRegion] = useState('All');

      const DEFAULT_CONFIG = {
        fastbotLaps: { ES: 1, MS: 2, HS: 3, US: 4 },
        linefollowBalls: { ES: 2, MS: 3, HS: 4, US: 5 }
      };
      const [systemConfig, setSystemConfig] = useState(DEFAULT_CONFIG);

      const authorizedTeams = useMemo(() => {
        if (!currentUser) return teams;
        if (currentUser.role === 'admin') {
          return adminRegion === 'All' ? teams : teams.filter(t => t.region === adminRegion);
        }
        return teams.filter(t => t.region === currentUser.region);
      }, [teams, currentUser, adminRegion]);
      
      const handleLogin = (username, password) => {
        const user = MOCK_USERS.find(u => u.username === username && u.password === password);
        if (user) {
          setCurrentUser(user);
          if (user.role === 'volunteer') setCurrentView('checkin');
          else if (user.role === 'admin' || user.role === 'region_admin') setCurrentView('operations');
          else setCurrentView('competing');
        } else {
          alert("Invalid credentials. Please refer to MOCK_USERS for valid combinations.");
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setCurrentView('dashboard');
        setAdminRegion('All');
      };

      const getTeamStatus = (team) => {
        const total = team.members.length + 1;
        const present = team.members.filter(m => m.present).length + (team.coach.present ? 1 : 0);
        if (present === 0) return 'No-Show';
        if (present === total) return 'Fully Arrived';
        return 'Partially Arrived';
      };

      const confirmAttendance = (teamId, coachPresent, updatedMembers) => {
        setTeams(prev => prev.map(team => {
          if (team.id !== teamId) return team;
          return {
            ...team,
            coach: { ...team.coach, present: coachPresent },
            members: updatedMembers
          };
        }));
      };

      const generateMatches = () => {
        setGroup2Matches([
          { id: 'match_1', title: 'Cyber Falcons vs. Desert Rovers (Sumo)', teamA: 'Cyber Falcons', teamB: 'Desert Rovers', categoryId: 'c2_sumo' },
          { id: 'match_2', title: 'Tech Titans vs. Maze Runners (Soccer)', teamA: 'Tech Titans', teamB: 'Maze Runners', categoryId: 'c2_soccer' }
        ]);
      };

      const generateParticipationId = (region, currentList) => {
        const regionLetter = region.charAt(0).toUpperCase();
        const currentMax = currentList.reduce((max, p) => {
          if (p.id.endsWith(regionLetter)) {
            const match = p.id.match(/^26(\d{3})/);
            const num = match ? parseInt(match[1], 10) : 0;
            return num > max ? num : max;
          }
          return max;
        }, 0);
        return `26${String(currentMax + 1).padStart(3, '0')}${regionLetter}`;
      };

      useEffect(() => {
        setParticipations(prevParticipations => {
          let newParticipations = [...prevParticipations];
          teams.forEach(team => {
            const status = getTeamStatus(team);
            if (status === 'Partially Arrived' || status === 'Fully Arrived') {
              team.categories.forEach(catId => {
                const existsIndex = newParticipations.findIndex(p => p.teamId === team.id && p.categoryId === catId);
                if (existsIndex === -1) {
                  newParticipations.push({
                    id: generateParticipationId(team.region, newParticipations),
                    teamId: team.id,
                    categoryId: catId,
                    status: status
                  });
                } else if (newParticipations[existsIndex].status !== status) {
                   newParticipations[existsIndex] = { ...newParticipations[existsIndex], status };
                }
              });
            } else if (status === 'No-Show') {
               newParticipations = newParticipations.filter(p => p.teamId !== team.id);
            }
          });
          return newParticipations;
        });
      }, [teams]);

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col font-sans">
          <header className="bg-slate-900 text-white shadow-md border-b-4 border-green-500">
            <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <div className="font-black text-3xl tracking-tighter">
                  <span className="text-green-500">R</span>
                  <span className="text-teal-400">A</span>
                  <span className="text-white">I</span>
                  <span className="text-white">N</span>
                </div>
                <div className="hidden md:block h-8 w-px bg-slate-700 mx-2"></div>
                <div className="hidden md:flex flex-col text-xs font-semibold tracking-widest text-slate-400">
                  <span>ROBOTICS-ENGINEERING AND</span>
                  <span>ARTIFICIAL INTELLIGENCE NEXUS</span>
                </div>
              </div>
              
              <div className="flex items-center space-x-4">
                {currentUser ? (
                  <div className="flex items-center space-x-4">
                    <span className="text-sm font-medium text-slate-300">
                      {currentUser.name} <span className="text-green-400">({currentUser.role})</span>
                    </span>
                    <button onClick={handleLogout} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition-colors">
                      <LogOut size={18} />
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => setCurrentView('login')}
                    className="px-4 py-2 bg-teal-600 hover:bg-teal-500 text-white font-semibold rounded-lg transition-colors shadow-sm"
                  >
                    Staff Portal
                  </button>
                )}
              </div>
            </div>
          </header>

          {currentUser?.role === 'admin' && (
            <div className="bg-slate-100 border-b border-slate-200 px-4 py-3 flex space-x-2 justify-center items-center">
              <span className="text-sm font-bold text-slate-600 mr-2">System Admin Region View:</span>
              {['All', 'Western', 'Central', 'Eastern'].map(r => (
                 <button
                    key={r}
                    onClick={() => setAdminRegion(r)}
                    className={`px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wide transition-colors ${adminRegion === r ? 'bg-slate-800 text-white shadow-sm' : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-50'}`}
                  >
                    {r}
                 </button>
              ))}
            </div>
          )}

          <nav className="bg-white shadow-sm sticky top-0 z-10">
            <div className="max-w-7xl mx-auto px-4 flex space-x-1 overflow-x-auto">
              <NavTab icon={BarChart3} label="Public Dashboard" active={currentView === 'dashboard'} onClick={() => setCurrentView('dashboard')} />
              
              {currentUser && (
                <React.Fragment>
                  {['admin', 'region_admin', 'volunteer'].includes(currentUser.role) && (
                    <NavTab icon={Users} label="Check-In System" active={currentView === 'checkin'} onClick={() => setCurrentView('checkin')} />
                  )}
                  {['admin', 'region_admin', 'head_ref', 'ref'].includes(currentUser.role) && (
                    <NavTab icon={Activity} label="Competing System" active={currentView === 'competing'} onClick={() => setCurrentView('competing')} />
                  )}
                  {['admin', 'region_admin'].includes(currentUser.role) && (
                    <NavTab icon={Settings} label="Operations" active={currentView === 'operations'} onClick={() => setCurrentView('operations')} />
                  )}
                </React.Fragment>
              )}
            </div>
          </nav>

          <main className="flex-1 max-w-7xl mx-auto w-full p-4 md:p-6">
            {currentView === 'dashboard' && <Dashboard teams={authorizedTeams} participations={participations} getTeamStatus={getTeamStatus} />}
            {currentView === 'login' && <Login handleLogin={handleLogin} />}
            {currentView === 'checkin' && <CheckInSystem teams={authorizedTeams} getTeamStatus={getTeamStatus} confirmAttendance={confirmAttendance} participations={participations} />}
            {currentView === 'competing' && <CompetingSystem categories={MOCK_CATEGORIES} participations={participations} teams={authorizedTeams} scores={scores} setScores={setScores} currentUser={currentUser} group2Matches={group2Matches} systemConfig={systemConfig} />}
            {currentView === 'operations' && <OperationsSystem scores={scores} setScores={setScores} teams={authorizedTeams} getTeamStatus={getTeamStatus} confirmAttendance={confirmAttendance} generateMatches={generateMatches} participations={participations} currentUser={currentUser} systemConfig={systemConfig} setSystemConfig={setSystemConfig} />}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
